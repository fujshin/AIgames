<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>そらの管制塔 v0.3</title>
<style>
  :root { --bg:#eaf4ff; --panel:#fff; --text:#24313f; --sub:#6b7b8c; --line:#d5dfea; --accent:#2b7de9; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html, body { width:100%; height:100dvh; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; display:flex; flex-direction:column; }
  header { height:48px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center;
    justify-content:space-between; padding:0 6px; gap:4px; flex-shrink:0; }
  .score { display:flex; align-items:baseline; gap:4px; background:rgba(43,125,233,.1); padding:3px 9px; border-radius:14px; }
  .score b { font-size:19px; color:var(--accent); font-variant-numeric:tabular-nums; }
  .score span { font-size:11px; font-weight:700; color:var(--sub); }
  .mid { display:flex; flex-direction:column; align-items:center; line-height:1.1; }
  .clock { font-size:14px; font-weight:900; font-variant-numeric:tabular-nums; }
  .hearts { font-size:12px; letter-spacing:-1px; }
  .btns { display:flex; gap:3px; }
  .btns button { border:1px solid var(--line); background:var(--bg); border-radius:8px; height:30px; padding:0 7px;
    font-size:12px; font-weight:800; color:var(--text); cursor:pointer; }
  .btns button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btns button.gd.on { background:#f59e0b; border-color:#f59e0b; }
  #stage { flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; touch-action:none; }
  .radio { position:absolute; top:6px; left:50%; transform:translateX(-50%); max-width:96%;
    background:rgba(20,30,45,.85); color:#fff; font-size:12px; font-weight:700; padding:5px 12px; border-radius:14px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none; transition:opacity .4s; }
  .radio.long { white-space:normal; text-align:center; line-height:1.45; }
  .radio.warn { background:rgba(200,30,30,.92); }
  .radio.hide { opacity:0; }
  footer { background:var(--panel); border-top:1px solid var(--line); padding:6px 8px 10px; flex-shrink:0; min-height:86px; }
  .sel { display:flex; align-items:center; gap:6px; font-size:13px; font-weight:800; margin-bottom:6px; min-height:22px; flex-wrap:wrap; }
  .sel .tag { padding:2px 8px; border-radius:8px; color:#fff; font-size:12px; }
  .sel .st { color:var(--sub); font-weight:700; font-size:12px; }
  .sel .tip { color:#b45309; font-weight:800; font-size:12.5px; }
  .cmds { display:flex; gap:6px; }
  .cmds button { flex:1; border:none; border-radius:12px; padding:11px 4px; font-size:15px; font-weight:900; color:#fff;
    background:var(--accent); cursor:pointer; }
  .cmds button.sub { background:#94a3b8; }
  .cmds button.go { background:#10b981; }
  .cmds button.gob { background:#0d9488; }
  .cmds button.warn { background:#ef4444; animation:pulse .6s infinite; }
  .cmds button.hint { box-shadow:0 0 0 3px #facc15; }
  .cmds .why { flex:1; font-size:12px; color:var(--sub); font-weight:700; align-self:center; text-align:center; }
  @keyframes pulse { 50% { transform:scale(1.04); } }
  .modal { position:fixed; inset:0; background:rgba(10,20,35,.6); display:none; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal.show { display:flex; }
  .card { background:var(--panel); border-radius:18px; padding:20px; width:100%; max-width:370px; text-align:center; max-height:92dvh; overflow-y:auto; }
  .card h2 { font-size:21px; margin-bottom:8px; }
  .card p { font-size:13px; color:var(--sub); line-height:1.6; margin-bottom:12px; }
  .rules { text-align:left; font-size:14px; line-height:1.65; margin:0 0 14px; list-style:none; }
  .rules li { margin-bottom:5px; }
  .big { width:100%; padding:13px; border:none; border-radius:12px; background:var(--accent); color:#fff; font-size:16px; font-weight:900; cursor:pointer; }
  .big.night { background:#4338ca; }
  .sec { width:100%; padding:10px; border:2px solid var(--line); border-radius:12px; background:var(--bg); font-size:14px; font-weight:800; margin-top:8px; cursor:pointer; color:var(--text); }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:10px 0 14px; text-align:left; }
  .stat { background:var(--bg); border-radius:10px; padding:6px 8px; }
  .stat .k { font-size:10.5px; color:var(--sub); font-weight:700; } .stat .v { font-size:15px; font-weight:900; }
  .stars { font-size:34px; color:#f59e0b; letter-spacing:4px; }
  .goals { text-align:left; font-size:13px; font-weight:700; line-height:1.8; margin:6px 0 4px; }
  .ver { font-size:10px; color:var(--sub); margin-top:8px; }
  .new { text-align:left; font-size:12.5px; line-height:1.6; background:#fef3c7; border-radius:10px; padding:8px 10px; margin-bottom:12px; }
  .resultbar { position:absolute; left:6px; right:6px; bottom:6px; background:rgba(20,30,45,.88); color:#fff; border-radius:12px;
    padding:7px 10px; font-size:12px; font-weight:700; display:none; gap:8px; align-items:center; }
  .resultbar.show { display:flex; } .resultbar div { flex:1; }
  .resultbar button { border:none; border-radius:8px; padding:6px 10px; font-weight:800; background:var(--accent); color:#fff; }
</style>
</head>
<body>
<header>
  <div class="score"><b id="uiScore">0</b><span>びん</span></div>
  <div class="mid"><div class="clock" id="uiClock">6:00</div><div class="hearts" id="uiHearts"></div></div>
  <div class="btns">
    <button class="gd" id="bGuide" onclick="toggleGuide()">💡</button>
    <button id="bPause" onclick="setSpeed(0)">⏸</button>
    <button id="b1" class="on" onclick="setSpeed(1)">1x</button>
    <button id="b2" onclick="setSpeed(2)">2x</button>
    <button onclick="openHelp()">？</button>
  </div>
</header>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="radio hide" id="uiRadio"></div>
  <div class="resultbar" id="resultBar"><div id="rbText"></div><button onclick="showOver()">けっか</button><button onclick="newGame()">もういちど</button></div>
</div>
<footer>
  <div class="sel" id="uiSel"></div>
  <div class="cmds" id="uiCmds"></div>
</footer>

<div class="modal show" id="mStart">
  <div class="card">
    <h2>🗼 そらの管制塔</h2>
    <ul class="rules">
      <li>✈️ ひこうきを タップして <b>着陸・ゲートへ・出発・離陸</b>の 指示を 出そう。</li>
      <li>🛣️ 1つの 滑走路を <b>2機が いっしょに 使うと 大事故</b>！</li>
      <li>⏳ 待たせすぎると お客さんが おこるよ（❤️が へる）。</li>
      <li>🌇 <b>夕方6時まで</b> 空港を まもりきろう！</li>
    </ul>
    <div class="new">🆕 時間が たつと <b>🛩️プロペラ機</b>・<b>🐘ジャンボ機</b>・<b>🚨きんきゅう機</b>・<b>⛈️かみなり雲</b>・<b>🌬️風向きの 変化</b>が 出てくるよ。お昼には <b>2本目の 滑走路 B</b>が オープン！<br>こまったら 上の <b>💡</b>で おすすめの 指示が 見られるよ。</div>
    <button class="big" onclick="startGame()">▶ 管制 スタート</button>
    <p style="margin:10px 0 0" id="uiBest"></p>
    <div class="ver" id="uiVer"></div>
  </div>
</div>

<div class="modal" id="mClear">
  <div class="card">
    <h2>🌇 1日 おつかれさま！</h2>
    <div class="stars" id="clStars"></div>
    <div class="goals" id="clGoals"></div>
    <div class="stats" id="clStats"></div>
    <button class="big night" onclick="goNight()">🌙 よるの部へ（どこまで いける？）</button>
    <button class="sec" onclick="newGame()">もういちど 朝から</button>
  </div>
</div>

<div class="modal" id="mOver">
  <div class="card">
    <h2 id="ovTitle">⚠️</h2>
    <p id="ovReason"></p>
    <div style="font-size:28px;font-weight:900;color:var(--accent)" id="ovScore"></div>
    <div class="stars" id="ovStars" style="font-size:24px"></div>
    <div class="stats" id="ovStats"></div>
    <button class="big" onclick="newGame()">もういちど</button>
    <button class="sec" onclick="viewBoard()">📷 さいごの 空港を 見る</button>
  </div>
</div>

<script>
'use strict';
const APP_VERSION = '0.3.0';
/* ============================================================
   そらの管制塔 — 空港を 管制する パズル風ゲーム
   v0.2: 機種3つ、着陸どうしの 間かく、🚨きんきゅう機、⛈️かみなり雲、夕方クリア＋★、よるの部、💡ガイド
   v0.3: 🌬️風向きの 変化（滑走路の 向きが 逆になる）、🛬2本目の 滑走路 B（着陸専用・Aを 横切って ゲートへ）
   ============================================================ */
const W = 360, H = 540;
// ---- 位置は「東向き（左から右へ 着陸・離陸）」で 書いておき、風が かわったら 左右を 反転する ----
const GROUND_Y = 255;
const RWY = { y: 330, x1: 50, x2: 310 };           // 滑走路 A（離陸と 着陸）
const RWB = { y: 285, x1: 50, x2: 310 };           // 滑走路 B（着陸専用・12時から）
const TWY = 400;
const HOLD_X = 28, EXIT_X = 290;
const CROSS_Y = 308;                                // B から おりた 機が A の 手前で まつ 線
const GATE_Y = 470;
const GATES = [120, 160, 200, 240].map(x => ({ x, plane: null }));
const FIX0 = { x: 72, y: 95 };
const FINAL0 = { A: [{ x: 26, y: 165 }, { x: 10, y: 262 }, { x: 22, y: 320 }, { x: RWY.x1, y: RWY.y }],
                 B: [{ x: 70, y: 150 }, { x: 44, y: 230 }, { x: 34, y: 278 }, { x: RWB.x1, y: RWB.y }] };
const SP = { air: 40, taxi: 32, lineup: 48 };
const TYPES = {
  prop:  { ja: 'プロペラ機', mark: '🛩️', final: 29, roll: 60, climb: 55, unload: 6,  pts: 1, size: 0.85,
           intro: '🆕 🛩️プロペラ機が 来るように なったよ。着陸が おそいので、うしろの ジェット機が 追いつかないように 気をつけて！' },
  jet:   { ja: 'ジェット機', mark: '',   final: 40, roll: 72, climb: 70, unload: 8,  pts: 1, size: 1.0 },
  jumbo: { ja: 'ジャンボ機', mark: '🐘', final: 44, roll: 52, climb: 58, unload: 13, pts: 2, size: 1.35,
           intro: '🆕 🐘ジャンボ機が 来るように なったよ。お客さんが 多いので 2びんぶん！ でも 滑走路も ゲートも 長く 使うよ。' }
};
const SPACING = 24;
const PATIENCE = 36;
const HOUR = 40;
const DAY_HOURS = 12;
const DAY_TARGET = 80;
const MAX_QUEUE = 3;
const HEARTS = 5;
const SEP_WARN = 36, SEP_CRASH = 14;
const EMG_FROM = 3, EMG_FUEL = 40, EMG_RATE = 0.18;
const STORM_FROM = 4, STORM_WARN = 12, STORM_LEN = 14;
const WIND_FROM = 5, WIND_WARN = 15, WIND_SWITCH = 6;
const RWB_OPEN = 6;                                 // 12時に B が オープン
const RWB_RATE = 0.75;                              // B が あいたら ひこうきが ふえる（間かく ×0.75）
const stormGap = () => 70 + Math.random() * 40;
const windGap = () => 85 + Math.random() * 40;
let ARR_START = 18, ARR_STEP = 0.35, ARR_FLOOR = 14.5;
const arrivalInterval = h => (h < DAY_HOURS ? Math.max(ARR_FLOOR, ARR_START - ARR_STEP * h) : Math.max(7, ARR_FLOOR - 0.6 * (h - DAY_HOURS + 1)))
  * (h >= RWB_OPEN ? RWB_RATE : 1);
const AIRLINES = [
  { n: 'そら', c: '#2b7de9' }, { n: 'にじ', c: '#e84a5f' }, { n: 'ほし', c: '#f59e0b' },
  { n: 'かぜ', c: '#10b981' }, { n: 'つき', c: '#8b5cf6' }
];

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let scale = 1, dpr = 1;
let planes = [], nextId = 1, selected = null;
let t = 0, score = 0, hearts = HEARTS, spawnT = 0, speed = 1;
let over = false, started = false, crashAt = null, overReason = '';
let dayDone = false, night = false, dayStars = 0;
let storm, wind, bOpen = false;
let D = 1;                                          // 1 = 東向き（→）、-1 = 西向き（←）
let seenTypes = new Set(), seenEmg = false;
let stats;
let guide = (() => { try { return localStorage.getItem('skyTowerGuide') !== '0'; } catch (e) { return true; } })();

// ---- 向きに あわせた 位置 ----
const X = x => (D > 0 ? x : W - x);
const fix = () => ({ x: X(FIX0.x), y: FIX0.y });
const finalPts = r => FINAL0[r].map(q => ({ x: X(q.x), y: q.y }));
const rwyOf = r => (r === 'B' ? RWB : RWY);

/* ---------- 音 ---------- */
let ac = null;
function tone(f, d = 0.08, type = 'sine', v = 0.07) {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) { /* noop */ }
}

/* ---------- 画面 ---------- */
function resize() {
  const st = document.getElementById('stage');
  scale = Math.min(st.clientWidth / W, st.clientHeight / H);
  dpr = window.devicePixelRatio || 1;
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
window.addEventListener('resize', resize);

let radioTimer = null, radioLock = 0;
function radio(msg, warn = false, sec = 2.6) {
  if (performance.now() < radioLock && !warn) return;
  const el = document.getElementById('uiRadio');
  el.textContent = msg; el.classList.toggle('warn', warn); el.classList.toggle('long', sec > 3); el.classList.remove('hide');
  clearTimeout(radioTimer); radioTimer = setTimeout(() => el.classList.add('hide'), sec * 1000);
  if (sec > 3) radioLock = performance.now() + sec * 1000;
}

/* ---------- ひこうき ---------- */
function newName() {
  const a = AIRLINES[Math.floor(Math.random() * AIRLINES.length)];
  return { name: a.n + (10 + Math.floor(Math.random() * 89)), color: a.c };
}
function makePlane(state, x, y, type = 'jet') {
  const p = { id: nextId++, ...newName(), type, tp: TYPES[type], state, x, y, ang: 0, path: [], pi: 0, pat: 1, gate: null,
    timer: 0, ux: 1, uy: 0, blocked: false, angry: 0, warn: false, rwyWarn: false, sepWarn: false, rwy: 'A',
    emg: false, fuel: 0, holdA: Math.random() * 6.28, since: t };
  planes.push(p);
  return p;
}
function typeFor(h) {
  const r = Math.random();
  if (h < 1) return 'jet';
  if (h < 3) return r < 0.35 ? 'prop' : 'jet';
  return r < 0.3 ? 'prop' : r < 0.78 ? 'jet' : 'jumbo';
}
function setPath(p, pts, sp) { p.path = pts.map(q => ({ x: q.x, y: q.y, s: q.s || sp })); p.pi = 0; }
function pathLeft(p) {
  let d = 0, x = p.x, y = p.y;
  for (let i = p.pi; i < p.path.length; i++) { d += Math.hypot(p.path[i].x - x, p.path[i].y - y); x = p.path[i].x; y = p.path[i].y; }
  return d;
}
function finalLenFrom(x, y, r) {
  const F = finalPts(r);
  let d = Math.hypot(F[0].x - x, F[0].y - y);
  for (let i = 1; i < F.length; i++) d += Math.hypot(F[i].x - F[i - 1].x, F[i].y - F[i - 1].y);
  return d;
}
const airborne = p => ['inbound', 'holding', 'final', 'goAround'].includes(p.state);
const onGround = p => ['landing', 'crossWait', 'crossing', 'exitWait', 'taxiIn', 'taxiOut', 'holdShort'].includes(p.state);
const isMain = p => Math.abs(p.y - TWY) < 1 && Math.abs(p.uy) < 0.2;

function sees(a, b) {
  const rx = b.x - a.x, ry = b.y - a.y, d = Math.hypot(rx, ry);
  return d < SPACING && rx * a.ux + ry * a.uy > 4;
}
function blockedAhead(p) {
  for (const o of planes) {
    if (o === p || !onGround(o)) continue;
    if (o.state === 'crossWait' && p.state === 'landing' && p.rwy === 'A') continue;   // Aの 手前で 待つ 機は Aの じゃまを しない
    if (!sees(p, o)) continue;
    if (sees(o, p)) {
      const pm = isMain(p), om = isMain(o);
      if (pm && !om) continue;
      if ((!pm && !om) || (pm && om)) { if (p.id < o.id) continue; }
    }
    return true;
  }
  return false;
}
function follow(p, dt, ground) {
  while (dt > 1e-6 && p.pi < p.path.length) {
    const q = p.path[p.pi], dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy);
    if (d < 0.01) { p.pi++; continue; }
    p.ux = dx / d; p.uy = dy / d;
    if (ground && blockedAhead(p)) { p.blocked = true; return false; }
    p.blocked = false;
    const step = Math.min(d, q.s * dt);
    p.x += p.ux * step; p.y += p.uy * step; p.ang = Math.atan2(p.uy, p.ux);
    dt -= step / q.s;
  }
  return p.pi >= p.path.length;
}

/* ---------- 滑走路 ---------- */
const crossingA = o => o.state === 'crossing' && o.y > RWY.y - 14 && o.y < RWY.y + 14;
function runwayUser(except, r = 'A') {
  return planes.find(o => o !== except && (
    (o.state === 'landing' && o.rwy === r && o.y < rwyOf(r).y + 8) ||
    (r === 'A' && o.state === 'takeoff' && D * (X(RWY.x2) - o.x) > 2) ||
    (r === 'A' && (crossingA(o) || (o.state === 'crossing' && o.y < RWY.y)))));
}
function runwayClearIn(u) {
  if (!u) return 0;
  if (u.blocked) return Infinity;
  if (u.state === 'takeoff') {
    const roll = Math.max(0, D * (X(RWY.x2) - u.x)) / (u.tp.roll + 20);
    return u.pi === 0 ? Math.hypot(X(RWY.x1) - u.x, RWY.y - u.y) / SP.lineup + (RWY.x2 - RWY.x1) / (u.tp.roll + 20) : roll;
  }
  if (u.state === 'landing') return Math.max(0, D * (X(EXIT_X) - u.x)) / u.tp.roll + 0.4;
  if (u.state === 'crossing') return Math.max(0, RWY.y + 14 - u.y) / SP.taxi;
  return 0;
}
const takeoffDur = p => Math.hypot(RWY.x1 - HOLD_X, RWY.y - TWY) / SP.lineup + (RWY.x2 - RWY.x1) / (p.tp.roll + 20);
function etaThreshold(p) { return p.state === 'final' ? pathLeft(p) / p.tp.final : Infinity; }
const finals = r => planes.filter(p => p.state === 'final' && (!r || p.rwy === r));
const minEta = r => Math.min(Infinity, ...finals(r).map(etaThreshold));
const queueCount = () => planes.filter(p => p.state === 'taxiOut' || p.state === 'holdShort').length;
const freeGate = () => GATES.filter(g => !g.plane).sort((a, b) => D * (b.x - a.x))[0];
// 滑走路が しまるまで 何秒か（かみなり・風）。しまっている 間は 0
function closingIn() {
  let s = Infinity;
  if (storm.phase === 'closed' || wind.phase === 'switch') return 0;
  if (storm.phase === 'warn') s = Math.min(s, storm.t);
  if (wind.phase === 'warn') s = Math.min(s, wind.t);
  return s;
}
function closedWhy() {
  if (storm.phase === 'closed') return `⛈️ かみなり中は 使えないよ（あと${Math.ceil(storm.t)}秒）`;
  if (wind.phase === 'switch') return `🌬️ 滑走路の 向きを かえているよ（あと${Math.ceil(wind.t)}秒）`;
  return null;
}

/* ---------- 指示 ---------- */
function canDo(p) {
  const cw = closedWhy();
  switch (p.state) {
    case 'inbound': case 'holding':
      if (cw) return { why: cw };
      return { k: 'land', label: p.emg ? '🚨 きんきゅう着陸 OK' : '🛬 着陸して よし', cls: p.emg ? 'warn' : 'go' };
    case 'final': return { k: 'goAround', label: '🔁 着陸 やりなおし', cls: p.warn ? 'warn' : 'sub' };
    case 'exitWait': return freeGate() ? { k: 'gate', label: '🅿️ ゲートへ', cls: 'go' } : { why: 'ゲートが あいていないよ（出発させて あけよう）' };
    case 'ready': return queueCount() < MAX_QUEUE ? { k: 'push', label: '🛫 出発（滑走路の 手前へ）', cls: 'go' } : { why: `離陸まちが ${MAX_QUEUE}機で いっぱいだよ` };
    case 'holdShort': {
      if (cw) return { why: cw };
      const u = runwayUser(p, 'A');
      if (u) return { why: u.state === 'crossing' ? `${u.name}が 滑走路Aを わたっているよ` : `滑走路Aに ${u.name}が いるよ` };
      return { k: 'takeoff', label: '🚀 離陸して よし', cls: 'go' };
    }
  }
  return null;
}
function goAround(p, msg) {
  p.state = 'goAround'; p.warn = p.rwyWarn = p.sepWarn = false; p.pat = Math.max(0, p.pat - 0.15); stats.goAround++;
  const F = fix();
  setPath(p, [{ x: p.x + 30 * D, y: p.y - 40 }, F], SP.air);
  radio(msg || `🗼 ${p.name}、着陸 やりなおし。上空で 待って ください。`); tone(440, 0.15, 'square', 0.05);
}
function command(p, k, r = 'A') {
  if (!p || over) return;
  const c = canDo(p);
  if (!c || c.k !== k) return;
  if (k === 'land') {
    if (r === 'B' && !bOpen) r = 'A';
    p.state = 'final'; p.warn = false; p.rwy = r;
    setPath(p, finalPts(r), p.tp.final);
    radio(`🗼 ${p.name}、滑走路${r}に 着陸して よろしい。`); tone(660); tone(880, 0.1);
  } else if (k === 'goAround') {
    goAround(p);
  } else if (k === 'gate') {
    const g = freeGate(); g.plane = p; p.gate = g; p.state = 'taxiIn';
    setPath(p, [{ x: p.x, y: TWY }, { x: g.x, y: TWY }, { x: g.x, y: GATE_Y }], SP.taxi);
    radio(`🗼 ${p.name}、${GATES.indexOf(g) + 1}番ゲートへ どうぞ。`); tone(620);
  } else if (k === 'push') {
    p.state = 'taxiOut';
    setPath(p, [{ x: p.gate.x, y: TWY }, { x: X(HOLD_X), y: TWY }], SP.taxi);
    radio(`🗼 ${p.name}、滑走路Aの 手前まで 進んで ください。`); tone(620);
  } else if (k === 'takeoff') {
    p.state = 'takeoff';
    setPath(p, [{ x: X(RWY.x1), y: RWY.y, s: SP.lineup }, { x: X(RWY.x2), y: RWY.y, s: p.tp.roll + 20 }, { x: X(W + 40), y: 220, s: p.tp.climb }], SP.taxi);
    radio(`🗼 ${p.name}、離陸して よろしい。いってらっしゃい！`); tone(700); tone(990, 0.12);
  }
  if (selected === p && !canDo(p)) selected = null;
  renderCmds();
}

/* ---------- 💡 ガイド（おすすめの 指示） ---------- */
function landSafe(p, r = 'A') {
  if (r === 'B' && !bOpen) return false;
  const T = finalLenFrom(p.x, p.y, r) / p.tp.final;
  if (closingIn() < T + 4) return false;
  const hs = r === 'A' && planes.find(q => q.state === 'holdShort');
  for (const f of finals(r)) {
    const occ = (EXIT_X - RWY.x1) / f.tp.roll + 0.8;
    if (T < etaThreshold(f) + occ + (hs ? takeoffDur(hs) + 1.2 : 1.5)) return false;
  }
  if (runwayUser(null, r) && runwayClearIn(runwayUser(null, r)) > T - 0.5) return false;
  if (planes.filter(q => q.state === 'exitWait' || q.state === 'landing' || q.state === 'crossWait').length >= 2 && !freeGate()) return false;
  if (r === 'B' && planes.filter(q => q.state === 'crossWait' || (q.state === 'landing' && q.rwy === 'B')).length >= 1 && T < 9) return false;
  return true;
}
function takeoffSafe(p) {
  if (minEta('A') < takeoffDur(p) + 0.8) return false;
  if (closingIn() < takeoffDur(p) + 1) return false;
  return true;
}
function bestRunway(p) {
  const order = bOpen ? (planes.some(q => q.state === 'holdShort' || q.state === 'taxiOut') ? ['B', 'A'] : ['A', 'B']) : ['A'];
  return order.find(r => landSafe(p, r));
}
function suggest() {
  const ok = (p, k) => { const c = canDo(p); return c && c.k === k; };
  const w = planes.find(p => p.warn); if (w) return { p: w, k: 'goAround', why: 'このままだと あぶない！' };
  const em = planes.find(p => p.emg && ok(p, 'land') && bestRunway(p)); if (em) return { p: em, k: 'land', r: bestRunway(em), why: 'きんきゅう機を さいしょに' };
  const g = planes.find(p => ok(p, 'gate')); if (g) return { p: g, k: 'gate', why: '出口を あけよう' };
  const hs = planes.find(p => ok(p, 'takeoff')); if (hs && takeoffSafe(hs)) return { p: hs, k: 'takeoff', why: 'つぎの 着陸まで 時間が ある' };
  const hold = planes.filter(p => ok(p, 'land') && bestRunway(p)).sort((a, b) => (b.emg - a.emg) || (a.pat - b.pat));
  if (hold.length) {
    const r = bestRunway(hold[0]);
    return { p: hold[0], k: 'land', r, why: r === 'B' ? 'Bに おろせば Aで 離陸できる' : planes.some(q => q.state === 'holdShort') ? '離陸の すきまを あけて 着陸' : '前の ひこうきと 間が あいている' };
  }
  const rd = planes.filter(p => ok(p, 'push')).sort((a, b) => a.pat - b.pat)[0]; if (rd) return { p: rd, k: 'push', why: 'ゲートを あけよう' };
  return null;
}

/* ---------- できごと ---------- */
function crash(a, b, why) {
  over = true; crashAt = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
  overReason = `${a.name}と ${b.name}が ${why}`;
  tone(160, 0.6, 'sawtooth', 0.12);
  finish('💥 ニアミス！');
}
function loseHearts(n, msg) {
  hearts -= n; radio(msg, true, 3);
  if (hearts <= 0) { overReason = '空港の 評判が 0に なっちゃった…'; over = true; finish('😢 評判 0'); return true; }
  return false;
}
function spawnArrival(h) {
  const type = typeFor(h);
  const p = makePlane('inbound', 40 + Math.random() * 280, -20, type);
  setPath(p, [fix()], SP.air);
  if (h >= EMG_FROM && !planes.some(q => q.emg) && Math.random() < EMG_RATE) {
    p.emg = true; p.fuel = EMG_FUEL; stats.emg++;
    if (!seenEmg) { seenEmg = true; radio(`🆕 🚨きんきゅう機！ ${p.name}「ぐあいの わるい お客さんが います。すぐ 着陸させて！」 ねんりょうが なくなる 前に おろそう`, true, 6); }
    else radio(`🚨 ${p.name}「きんきゅうです！ すぐ 着陸させて ください！」`, true);
    tone(900, 0.12, 'square', 0.06); tone(700, 0.12, 'square', 0.06);
  } else if (!seenTypes.has(type) && TYPES[type].intro) radio(TYPES[type].intro, false, 6);
  else radio(`✈️ ${p.name}${p.tp.mark}「着陸したいです。どうぞ」`);
  seenTypes.add(type);
}
function updateStorm(dt, h) {
  if (h < STORM_FROM) return;
  if (storm.phase === 'none') {
    if (wind.phase !== 'none') return;
    storm.next -= dt;
    if (storm.next <= 0) {
      storm.phase = 'warn'; storm.t = STORM_WARN; stats.storms++;
      radio(stats.storms === 1 ? `🆕 ⛈️ かみなり雲が 来るよ！ ${STORM_WARN}秒後に 滑走路を しめるよ。それまでに 着陸できない ひこうきは 上で 待たせよう`
                               : `⛈️ かみなり雲が 来るよ！ ${STORM_WARN}秒後に 滑走路を しめるよ`, true, stats.storms === 1 ? 6 : 3);
      tone(240, 0.3, 'triangle', 0.08);
    }
  } else if (storm.phase === 'warn') {
    storm.t -= dt;
    if (storm.t <= 0) {
      storm.phase = 'closed'; storm.t = STORM_LEN;
      for (const q of finals()) goAround(q, `⛈️ かみなりで ${q.name}は 着陸 やりなおし！`);
      tone(120, 0.5, 'sawtooth', 0.06);
    }
  } else {
    storm.t -= dt;
    if (storm.t <= 0) { storm.phase = 'none'; storm.next = stormGap(); radio('☀️ かみなり雲が いなくなったよ。滑走路 再開！'); }
  }
}
// 🌬️ 風向きの 変化：予告 → 向きかえ（しめきり）→ 逆向きで 再開
function updateWind(dt, h) {
  if (h < WIND_FROM) return;
  if (wind.phase === 'none') {
    if (storm.phase !== 'none') return;
    wind.next -= dt;
    if (wind.next <= 0) {
      wind.phase = 'warn'; wind.t = WIND_WARN; stats.winds++;
      const dir = D > 0 ? '←（右から 左へ）' : '→（左から 右へ）';
      radio(stats.winds === 1
        ? `🆕 🌬️ 風向きが かわるよ！ ひこうきは 向かい風で おりるので、${WIND_WARN}秒後に 滑走路の 向きが ${dir}に なるよ。上で 待つ 場所も かわるよ`
        : `🌬️ 風向きが かわるよ！ ${WIND_WARN}秒後に 滑走路の 向きが ${dir}に`, true, stats.winds === 1 ? 6.5 : 3);
      tone(330, 0.25, 'triangle', 0.07);
    }
  } else if (wind.phase === 'warn') {
    wind.t -= dt;
    if (wind.t <= 0) {
      wind.phase = 'switch'; wind.t = WIND_SWITCH;
      for (const q of finals()) goAround(q, `🌬️ 風が かわったので ${q.name}は 着陸 やりなおし！`);
      flipRunway();
      tone(180, 0.4, 'triangle', 0.06);
    }
  } else {
    wind.t -= dt;
    if (wind.t <= 0) { wind.phase = 'none'; wind.next = windGap(); radio(`🌬️ 向きかえ かんりょう！ 滑走路は ${D > 0 ? '→' : '←'} 向きだよ`); }
  }
}
function flipRunway() {
  D = -D;
  const F = fix();
  for (const p of planes) {
    if (['inbound', 'holding', 'goAround'].includes(p.state)) { p.state = 'goAround'; setPath(p, [F], SP.air); }
    else if (p.state === 'holdShort' || p.state === 'taxiOut') {
      const pts = [];
      if (p.y > TWY + 0.5) pts.push({ x: p.x, y: TWY });
      pts.push({ x: X(HOLD_X), y: TWY });
      p.state = 'taxiOut'; setPath(p, pts, SP.taxi);
    }
  }
}
function openRunwayB() {
  bOpen = true;
  radio('🆕 🛬 2本目の 滑走路 B が オープン！ Bは 着陸せんよう。Bに おりた ひこうきは、Aが あいたら Aを わたって ゲートへ 行くよ。ひこうきも ふえるよ！', false, 7);
  tone(523, 0.12, 'triangle'); tone(784, 0.18, 'triangle');
}

/* ---------- 進行 ---------- */
function update(dt) {
  if (over || speed === 0 || !started) return;
  dt *= speed; t += dt;
  const h = Math.floor(t / HOUR);
  if (!dayDone && t >= DAY_HOURS * HOUR) { dayDone = true; dayClear(); return; }
  if (!bOpen && h >= RWB_OPEN) openRunwayB();

  spawnT -= dt;
  if (spawnT <= 0) { spawnT = arrivalInterval(h) * (0.8 + Math.random() * 0.4); spawnArrival(h); }
  updateStorm(dt, h);
  updateWind(dt, h);

  for (const p of planes.slice()) {
    p.angry = Math.max(0, p.angry - dt);
    if (p.emg && airborne(p)) {
      p.fuel -= dt;
      if (p.fuel <= 0) {
        planes.splice(planes.indexOf(p), 1); if (selected === p) selected = null; stats.emgLost++;
        if (loseHearts(2, `🚨 ${p.name}は ねんりょうが なくなりそうで、ほかの 空港へ 行っちゃった…（❤️-2）`)) return;
        continue;
      }
    }
    switch (p.state) {
      case 'inbound': case 'goAround':
        if (follow(p, dt, false)) { p.state = 'holding'; p.since = t; }
        break;
      case 'holding': {
        p.holdA += dt * 0.9;
        const F = fix();
        const slot = planes.filter(o => o.state === 'holding' && o.since < p.since).length;
        const r = 22 + slot * 13;
        const tx = F.x + Math.cos(p.holdA) * r, ty = F.y + Math.sin(p.holdA) * r * 0.55;
        p.ang = Math.atan2(ty - p.y, tx - p.x); p.x += (tx - p.x) * Math.min(1, dt * 3); p.y += (ty - p.y) * Math.min(1, dt * 3);
        break;
      }
      case 'final': {
        const done = follow(p, dt, false);
        const u = runwayUser(p, p.rwy);
        p.rwyWarn = !!u && etaThreshold(p) < 3.2 && runwayClearIn(u) > etaThreshold(p) - 0.2;
        if (done) {
          if (u) { crash(p, u, `滑走路${p.rwy}で ぶつかりそうに なった！`); return; }
          p.state = 'landing'; p.warn = p.rwyWarn = p.sepWarn = false;
          if (p.emg) { p.emg = false; score += 2; stats.emgSaved++; radio(`🚑 ${p.name}「たすかりました！ ありがとう！」 ボーナス+2`, false, 3); tone(1040, 0.15, 'triangle'); }
          const R = rwyOf(p.rwy);
          setPath(p, [{ x: X(EXIT_X), y: R.y, s: p.tp.roll }, { x: X(EXIT_X), y: p.rwy === 'B' ? CROSS_Y : 385, s: SP.taxi }], p.tp.roll);
          if (p.rwy === 'B') stats.landB++;
          tone(500, 0.06);
        }
        break;
      }
      case 'landing':
        if (follow(p, dt, true)) {
          if (p.rwy === 'B') { p.state = 'crossWait'; p.since = t; }
          else { p.state = 'exitWait'; p.since = t; radio(`✈️ ${p.name}「着陸しました。ゲートを ください」`); }
        }
        break;
      case 'crossWait': {
        // A が あいていて、A への 着陸が 4秒より 先なら 自動で わたる
        const u = runwayUser(p, 'A');
        const stubBusy = planes.some(o => o !== p && Math.abs(o.x - p.x) < 4 && o.y > RWY.y + 4 && o.y < TWY - 1);   // 出口の 道に ひこうきが いたら 待つ（A の 上で 止まらないように）
        if (!u && !stubBusy && minEta('A') > 4 && closingIn() > 0) { p.state = 'crossing'; setPath(p, [{ x: p.x, y: 385 }], SP.taxi); }
        break;
      }
      case 'crossing':
        if (follow(p, dt, true)) { p.state = 'exitWait'; p.since = t; radio(`✈️ ${p.name}「Aを わたりました。ゲートを ください」`); }
        break;
      case 'taxiIn':
        if (follow(p, dt, true)) { p.state = 'unload'; p.timer = p.tp.unload; score += p.tp.pts; stats.arr++; tone(880, 0.06); }
        break;
      case 'unload':
        p.timer -= dt;
        if (p.timer <= 0) { Object.assign(p, newName()); p.state = 'ready'; p.pat = 1; p.since = t; radio(`✈️ ${p.name}「出発の じゅんび OK です」`); }
        break;
      case 'taxiOut':
        if (p.gate && p.y <= TWY + 0.5) { p.gate.plane = null; p.gate = null; }
        if (follow(p, dt, true)) { p.state = 'holdShort'; p.since = t; radio(`✈️ ${p.name}「離陸の じゅんび OK です」`); }
        break;
      case 'takeoff':
        if (follow(p, dt, false)) { planes.splice(planes.indexOf(p), 1); score += p.tp.pts; stats.dep++; if (selected === p) selected = null; }
        break;
    }
    const waiting = ['holding', 'exitWait', 'ready', 'holdShort'].includes(p.state);
    const slow = (['taxiOut', 'taxiIn', 'landing', 'crossing'].includes(p.state) && p.blocked) || p.state === 'crossWait';
    if (!p.emg && (waiting || slow)) {
      p.pat -= dt / PATIENCE * (slow ? 0.5 : 1);
      if (p.pat <= 0) {
        p.pat = 1; p.angry = 2.5; stats.angry++; tone(200, 0.3, 'square', 0.08);
        if (loseHearts(1, `😡 ${p.name}の お客さんが おこっちゃった！`)) return;
      }
    }
  }
  // 着陸どうしの 間かく（滑走路ごと）
  for (const r of ['A', 'B']) {
    const fs = finals(r).sort((a, b) => pathLeft(a) - pathLeft(b));
    for (const q of fs) q.sepWarn = false;
    for (let i = 1; i < fs.length; i++) {
      const l = fs[i - 1], f = fs[i], d = Math.hypot(f.x - l.x, f.y - l.y);
      if (d < SEP_CRASH) { crash(l, f, '空の 上で 近づきすぎて しまった！'); return; }
      if (d < SEP_WARN) f.sepWarn = true;
    }
  }
  for (const q of finals()) q.warn = q.rwyWarn || q.sepWarn;
  const w = planes.find(p => p.warn);
  if (w) {
    if (!selected || !selected.warn) { selected = w; renderCmds(); }
    radio(w.sepWarn ? `⚠️ あぶない！ ${w.name}が 前の ひこうきに 追いつきそう` : `⚠️ あぶない！ ${w.name}が 着陸しそう。滑走路${w.rwy}が つかわれているよ`, true);
  }
}

/* ---------- 入力 ---------- */
function pick(e) {
  if (!started || over) return;
  const r = cv.getBoundingClientRect(), pt = e.touches ? e.touches[0] : e;
  const x = (pt.clientX - r.left) / scale, y = (pt.clientY - r.top) / scale;
  let best = null, bd = 30;
  for (const p of planes) { const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = p; } }
  selected = best; if (best) tone(520, 0.04);
  renderCmds();
}
cv.addEventListener('mousedown', pick);
cv.addEventListener('touchstart', e => { e.preventDefault(); pick(e); }, { passive: false });

const STATE_JA = {
  inbound: '空港へ むかっている', holding: '上空で 着陸を まっている', final: '着陸に むかっている', goAround: '上空へ もどっている',
  landing: '着陸した', crossWait: '滑走路Aを わたるのを まっている', crossing: '滑走路Aを わたっている',
  exitWait: 'ゲートを まっている', taxiIn: 'ゲートへ 走っている', unload: 'お客さんが おりている',
  ready: '出発を まっている', taxiOut: '滑走路の 手前へ 走っている', holdShort: '離陸を まっている', takeoff: '離陸中'
};
const tagHtml = p => `<span class="tag" style="background:${p.color}">${p.name}${p.tp.mark}</span>`;
function renderCmds() {
  const sel = document.getElementById('uiSel'), box = document.getElementById('uiCmds');
  box.innerHTML = '';
  const sg = guide && !over ? suggest() : null;
  if (!selected || !planes.includes(selected)) {
    selected = null;
    if (sg) {
      const c = canDo(sg.p);
      const lab = sg.k === 'land' && bOpen ? `🛬 ${sg.r}に 着陸` : c.label;
      sel.innerHTML = `<span class="tip">💡 おすすめ：</span>${tagHtml(sg.p)}<span class="tip">を「${lab}」</span><span class="st">（${sg.why}）</span>`;
      const b = document.createElement('button');
      b.className = 'sub'; b.textContent = `${sg.p.name}を えらぶ`;
      b.onclick = () => { selected = sg.p; tone(520, 0.04); renderCmds(); };
      box.appendChild(b);
    } else {
      sel.innerHTML = '<span class="st">✈️ ひこうきを タップして えらんでね（❗が 出ている ひこうきは 指示を まっているよ）</span>';
    }
    return;
  }
  const p = selected;
  let extra = '';
  if (p.state === 'final') extra = `・滑走路${p.rwy}まで あと ${etaThreshold(p).toFixed(0)}秒`;
  if (p.state === 'unload') extra = `・あと ${Math.ceil(p.timer)}秒`;
  if (p.emg && airborne(p)) extra += `・ねんりょう あと${Math.ceil(p.fuel)}秒`;
  sel.innerHTML = `${tagHtml(p)}<span class="st">${p.tp.ja}・${STATE_JA[p.state]}${extra}</span>`;
  const c = canDo(p);
  if (!c) { box.innerHTML = '<div class="why">いまは 指示は いらないよ</div>'; return; }
  if (c.why) { box.innerHTML = `<div class="why">⏳ ${c.why}</div>`; return; }
  if (c.k === 'land' && bOpen) {
    for (const r of ['A', 'B']) {
      const b = document.createElement('button');
      b.className = (r === 'B' ? 'gob' : c.cls || '') + (p.emg ? ' warn' : '') + (sg && sg.p === p && sg.k === 'land' && sg.r === r ? ' hint' : '');
      b.textContent = `🛬 ${r}に 着陸` + (guide && !landSafe(p, r) ? ' 💡まだ' : '');
      b.onclick = () => command(p, 'land', r);
      box.appendChild(b);
    }
    return;
  }
  const b = document.createElement('button');
  b.className = (c.cls || '') + (sg && sg.p === p && sg.k === c.k ? ' hint' : '');
  b.textContent = c.label;
  b.onclick = () => command(p, c.k, 'A');
  box.appendChild(b);
  if (guide && c.k === 'land' && !landSafe(p, 'A')) {
    const why = document.createElement('div'); why.className = 'why'; why.style.flex = '0.9';
    why.textContent = closingIn() < 30 ? '💡 まもなく しまるよ' : '💡 まだ 早いかも';
    box.appendChild(why);
  }
  if (guide && c.k === 'takeoff' && !takeoffSafe(p)) {
    const why = document.createElement('div'); why.className = 'why'; why.style.flex = '0.9';
    why.textContent = closingIn() < 30 ? '💡 まもなく しまるよ' : '💡 着陸機が 近いよ';
    box.appendChild(why);
  }
}

/* ---------- 描画 ---------- */
function mix(a, b, k) {
  const pa = [1, 3, 5].map(i => parseInt(a.substr(i, 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.substr(i, 2), 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * k).toString(16).padStart(2, '0')).join('');
}
function drawRunway(R, name, open, busy, closedNow, label, col) {
  const x1 = Math.min(X(R.x1), X(R.x2)), x2 = Math.max(X(R.x1), X(R.x2));
  ctx.globalAlpha = open ? 1 : 0.45;
  ctx.fillStyle = '#4b5563'; ctx.fillRect(x1 - 10, R.y - 11, x2 - x1 + 20, 22);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
  ctx.beginPath(); ctx.moveTo(x1 + 14, R.y); ctx.lineTo(x2 - 14, R.y); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#fff'; ctx.font = '900 11px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(name, X(R.x1) - 2 * D, R.y + 4);
  if (night && open) { ctx.fillStyle = '#fde047'; for (let x = x1 - 6; x <= x2 + 6; x += 22) { ctx.fillRect(x, R.y - 13, 2, 2); ctx.fillRect(x, R.y + 11, 2, 2); } }
  // 進む 向きの 矢印
  if (open) {
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    for (const ax of [x1 + 70, x1 + 150]) {
      ctx.beginPath(); ctx.moveTo(ax + 7 * D, R.y + 7); ctx.lineTo(ax - 3 * D, R.y + 3); ctx.lineTo(ax - 3 * D, R.y + 11); ctx.closePath(); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  if (!open) { ctx.fillStyle = '#92400e'; ctx.font = '800 10px sans-serif'; ctx.fillText(`🚧 滑走路${name}：12時 オープン`, (x1 + x2) / 2, R.y - 15); return; }
  ctx.fillStyle = busy || closedNow ? '#ef4444' : '#22c55e';
  for (const x of [x1 - 6, x2 + 6]) { ctx.beginPath(); ctx.arc(x, R.y - 16, 4, 0, 7); ctx.fill(); }
  ctx.font = '800 10.5px sans-serif'; ctx.fillStyle = col; ctx.fillText(label, (x1 + x2) / 2, R.y - 15);
}
function rwyLabel(r) {
  const busy = runwayUser(null, r);
  if (storm.phase === 'closed') return { busy, closed: true, label: `⛈️ かみなり中 しめきり（あと${Math.ceil(storm.t)}秒）`, col: '#ef4444' };
  if (wind.phase === 'switch') return { busy, closed: true, label: `🌬️ 向きかえ中（あと${Math.ceil(wind.t)}秒）`, col: '#ef4444' };
  const cl = closingIn();
  const who = busy ? (busy.state === 'crossing' ? `${busy.name}が わたっている` : `${busy.name}が 使用中`) : '';
  if (cl < Infinity) return { busy, closed: false, label: `${storm.phase === 'warn' ? '⛈️' : '🌬️'} あと${Math.ceil(cl)}秒で しまる` + (who ? `・${who}` : ''), col: '#c2410c' };
  if (busy) return { busy, closed: false, label: `滑走路${r}：${who}`, col: '#ef4444' };
  return { busy, closed: false, label: r === 'B' ? '滑走路B（着陸せんよう）：あいてる' : '滑走路A：あいてる', col: night ? '#86efac' : '#15803d' };
}
function draw(now) {
  const dusk = night ? 1 : Math.max(0, Math.min(1, (t / HOUR - (DAY_HOURS - 2)) / 2));
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, night ? '#1e1b4b' : mix('#9fd3ff', '#fb923c', dusk)); g.addColorStop(1, night ? '#3730a3' : mix('#dff1ff', '#fde68a', dusk));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND_Y);
  ctx.fillStyle = night ? '#365314' : '#b9e3a5'; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  if (night) { ctx.fillStyle = '#fff'; for (let i = 0; i < 24; i++) { ctx.globalAlpha = 0.4 + 0.4 * Math.sin(now * 2 + i); ctx.fillRect((i * 97) % W, (i * 53) % 230, 2, 2); } ctx.globalAlpha = 1; }
  ctx.fillStyle = night ? 'rgba(255,255,255,.25)' : 'rgba(255,255,255,.8)';
  for (const [cx, cy, s] of [[230, 60, 1], [300, 150, .7], [160, 200, .8]]) {
    const ox = ((now * 4 * s * D) % 420 + 420) % 420 - 30;
    ctx.beginPath(); ctx.arc((cx + ox) % (W + 60) - 30, cy, 14 * s, 0, 7); ctx.arc((cx + ox) % (W + 60) - 14, cy - 6, 16 * s, 0, 7);
    ctx.arc((cx + ox) % (W + 60) + 2, cy, 13 * s, 0, 7); ctx.fill();
  }
  // まち地点と 着陸コース
  const F = fix();
  ctx.save(); ctx.setLineDash([4, 5]); ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(43,125,233,.5)';
  ctx.beginPath(); ctx.ellipse(F.x, F.y, 30, 17, 0, 0, 7); ctx.stroke();
  for (const r of bOpen ? ['A', 'B'] : ['A']) {
    ctx.strokeStyle = r === 'B' ? 'rgba(13,148,136,.55)' : 'rgba(43,125,233,.5)';
    ctx.beginPath(); ctx.moveTo(F.x, F.y); for (const q of finalPts(r)) ctx.lineTo(q.x, q.y); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = night ? '#c7d2fe' : 'rgba(43,125,233,.85)'; ctx.font = '700 10px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('まち', F.x, F.y + 3);
  // 吹き流し（風）
  const wx = X(330), wy = 30;
  ctx.fillStyle = '#6b7280'; ctx.fillRect(wx - 1, wy, 2, 26);
  const flap = Math.sin(now * 6) * 2;
  ctx.fillStyle = '#f97316';
  ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx - 22 * D, wy + 3 + flap); ctx.lineTo(wx - 22 * D, wy + 9 + flap); ctx.lineTo(wx, wy + 12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = night ? '#e0e7ff' : '#334155'; ctx.font = '800 9px sans-serif';
  ctx.fillText(wind.phase === 'warn' ? `🌬️ あと${Math.ceil(wind.t)}秒で 逆に` : `🌬️ 風 ${D > 0 ? '←' : '→'}`, wx - 6 * D, wy + 26);

  // 滑走路
  const la = rwyLabel('A');
  drawRunway(RWY, 'A', true, la.busy, la.closed, la.label, la.col);
  const lb = rwyLabel('B');
  drawRunway(RWB, 'B', bOpen, lb.busy, lb.closed, lb.label, lb.col);

  // 誘導路・ゲート
  ctx.strokeStyle = '#9ca3af'; ctx.lineWidth = 12; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(X(EXIT_X), RWY.y); ctx.lineTo(X(EXIT_X), TWY); ctx.lineTo(X(HOLD_X), TWY); ctx.lineTo(X(RWY.x1), RWY.y); ctx.stroke();
  // 反対がわの 出口と 待ち（向きが かわったときに 使う）
  ctx.globalAlpha = 0.35;
  ctx.beginPath(); ctx.moveTo(W - X(EXIT_X), RWY.y); ctx.lineTo(W - X(EXIT_X), TWY); ctx.lineTo(W - X(HOLD_X), TWY); ctx.lineTo(W - X(RWY.x1), RWY.y); ctx.stroke();
  ctx.globalAlpha = 1;
  if (bOpen) { ctx.beginPath(); ctx.moveTo(X(EXIT_X), RWB.y); ctx.lineTo(X(EXIT_X), RWY.y); ctx.stroke(); }
  for (const gt of GATES) { ctx.beginPath(); ctx.moveTo(gt.x, TWY); ctx.lineTo(gt.x, GATE_Y); ctx.stroke(); }
  ctx.strokeStyle = '#facc15'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.moveTo(X(EXIT_X), TWY); ctx.lineTo(X(HOLD_X), TWY); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = night ? '#d1d5db' : '#6b7280'; ctx.font = '700 9px sans-serif';
  ctx.fillText(D > 0 ? '◀ 誘導路（左へ 一方通行）' : '誘導路（右へ 一方通行） ▶', 180, TWY - 9);
  ctx.fillStyle = '#dc2626'; ctx.fillRect(X(HOLD_X) + 6 * D - 1.5, TWY - 14, 3, 28);
  ctx.fillStyle = night ? '#fecaca' : '#7f1d1d'; ctx.fillText('離陸まち', X(HOLD_X) + 20 * D, TWY + 22);
  if (bOpen) { ctx.fillStyle = '#dc2626'; ctx.fillRect(X(EXIT_X) - 9, CROSS_Y + 4, 18, 3); }
  ctx.fillStyle = night ? '#fef3c7' : '#e5e7eb'; ctx.fillRect(90, GATE_Y + 14, 180, 40);
  ctx.fillStyle = '#374151'; ctx.font = '800 12px sans-serif'; ctx.fillText('🏢 ターミナル', 180, GATE_Y + 39);
  GATES.forEach((gt, i) => {
    ctx.fillStyle = gt.plane ? '#fca5a5' : '#86efac';
    ctx.beginPath(); ctx.arc(gt.x, GATE_Y, 13, 0, 7); ctx.fill();
    ctx.fillStyle = '#374151'; ctx.font = '700 9px sans-serif'; ctx.fillText(String(i + 1), gt.x, GATE_Y + 26);
  });

  // かみなり雲
  if (storm.phase !== 'none') {
    const closedNow = storm.phase === 'closed';
    const a = closedNow ? 0.55 : 0.25 * (1 - storm.t / STORM_WARN) + 0.05;
    ctx.fillStyle = `rgba(55,65,81,${a})`; ctx.fillRect(0, 230, W, 140);
    ctx.font = closedNow ? '34px sans-serif' : '24px sans-serif';
    ctx.fillText('⛈️', 120, 250); ctx.fillText('⛈️', 250, 244);
    if (closedNow) {
      ctx.strokeStyle = 'rgba(191,219,254,.7)'; ctx.lineWidth = 1;
      for (let i = 0; i < 30; i++) { const x = (i * 37 + now * 140) % W, y = 230 + (i * 29 + now * 220) % 140; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 3, y + 9); ctx.stroke(); }
      if (Math.sin(now * 9) > 0.97) { ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(0, 0, W, H); }
    }
  }
  // 向きかえ中の 風
  if (wind.phase === 'switch') {
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const y = 240 + i * 14, x = ((now * 160 * -D + i * 70) % (W + 80) + W + 80) % (W + 80) - 40;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 30 * -D, y); ctx.stroke();
    }
  }

  const sg = guide && !over ? suggest() : null;
  for (const p of planes) drawPlane(p, now, sg && sg.p === p);
  if (crashAt) { ctx.font = '40px sans-serif'; ctx.fillText('💥', crashAt.x, crashAt.y + 14); }
}
function drawPlane(p, now, hinted) {
  const air = airborne(p) || (p.state === 'takeoff' && D * (p.x - X(RWY.x2)) >= 0);
  const s = (air ? 1.15 : 0.95) * p.tp.size;
  if (air) { ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(p.x + 6, p.y + 12, 9 * s, 4 * s, 0, 0, 7); ctx.fill(); }
  if (hinted) {
    ctx.save(); ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2.5; ctx.setLineDash([4, 3]); ctx.lineDashOffset = -now * 20;
    ctx.beginPath(); ctx.arc(p.x, p.y, 21 + Math.sin(now * 6) * 2, 0, 7); ctx.stroke(); ctx.restore();
  }
  if (selected === p) { ctx.strokeStyle = '#facc15'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, 17 * Math.max(1, s), 0, 7); ctx.stroke(); }
  if (p.emg && airborne(p)) {
    ctx.fillStyle = `rgba(239,68,68,${0.25 + 0.2 * Math.sin(now * 8)})`; ctx.beginPath(); ctx.arc(p.x, p.y, 19, 0, 7); ctx.fill();
  }
  ctx.fillStyle = p.color; ctx.globalAlpha = .85; ctx.beginPath(); ctx.arc(p.x, p.y, 11 * s, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.ang + Math.PI / 4);
  ctx.font = `${Math.round(16 * s)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('✈️', 0, 1);
  ctx.restore();
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'center';
  ctx.font = '800 9px sans-serif'; ctx.fillStyle = night && air ? '#fff' : '#1f2937';
  ctx.fillText(p.name + p.tp.mark, p.x, p.y + 12 * s + 10);
  if (p.emg && airborne(p)) {
    const w = 26, k = Math.max(0, p.fuel / EMG_FUEL);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(p.x - w / 2, p.y - 25, w, 4);
    ctx.fillStyle = k > 0.4 ? '#f59e0b' : '#ef4444'; ctx.fillRect(p.x - w / 2, p.y - 25, w * k, 4);
    ctx.font = '12px sans-serif'; ctx.fillText('🚨', p.x - 18, p.y - 18);
  }
  const c = canDo(p);
  const asking = (c && (c.k || c.why) && p.state !== 'final') || p.state === 'crossWait';
  if (asking && !p.emg) {
    ctx.strokeStyle = p.pat > .5 ? '#22c55e' : p.pat > .25 ? '#f59e0b' : '#ef4444'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, 14 * Math.max(1, s), -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * p.pat); ctx.stroke();
    const bob = Math.sin(now * 6 + p.id) * 2;
    ctx.font = '13px sans-serif'; ctx.fillText(p.angry > 0 ? '😡' : p.state === 'crossWait' ? '⏳' : '❗', p.x + 13 * Math.max(1, s), p.y - 12 + bob);
  }
  if (p.state === 'final') {
    ctx.font = '800 10px sans-serif'; ctx.fillStyle = p.warn ? '#dc2626' : p.rwy === 'B' ? '#0f766e' : night ? '#bfdbfe' : '#1d4ed8';
    ctx.fillText(p.sepWarn ? 'ちかい！' : `${p.rwy} あと${etaThreshold(p).toFixed(0)}秒`, p.x, p.y - 15 * Math.max(1, s));
  }
  if (p.state === 'unload') { ctx.font = '800 9px sans-serif'; ctx.fillStyle = '#374151'; ctx.fillText(`🧳${Math.ceil(p.timer)}`, p.x, p.y - 15); }
}

/* ---------- UI ---------- */
function clockText() {
  const h = 6 + Math.floor(t / HOUR), m = Math.floor((t % HOUR) / HOUR * 60 / 10) * 10;
  return `${h}:${String(m).padStart(2, '0')}`;
}
function updateUI() {
  document.getElementById('uiScore').textContent = score;
  document.getElementById('uiClock').textContent = (night ? '🌙' : '') + clockText();
  document.getElementById('uiHearts').textContent = '❤️'.repeat(Math.max(0, hearts)) + '🤍'.repeat(Math.max(0, HEARTS - Math.max(0, hearts)));
  document.getElementById('bGuide').classList.toggle('on', guide);
}
function setSpeed(s) {
  speed = s;
  document.getElementById('bPause').classList.toggle('on', s === 0);
  document.getElementById('b1').classList.toggle('on', s === 1);
  document.getElementById('b2').classList.toggle('on', s === 2);
}
function toggleGuide() {
  guide = !guide;
  try { localStorage.setItem('skyTowerGuide', guide ? '1' : '0'); } catch (e) { /* noop */ }
  radio(guide ? '💡 ガイド オン：おすすめの 指示が 出るよ' : '💡 ガイド オフ：自分で 考えて みよう！');
  renderCmds(); updateUI();
}
function bestScore() { try { return +localStorage.getItem('skyTowerBest') || 0; } catch (e) { return 0; } }
function bestStars() { try { return +localStorage.getItem('skyTowerStars') || 0; } catch (e) { return 0; } }
const starStr = n => '★'.repeat(n) + '☆'.repeat(3 - n);
function statItems(best) {
  return [['がんばった 時間', clockText() + ' まで'], ['いちばんの 記録', best + ' びん'],
    ['🛬 到着 ／ 🛫 出発', `${stats.arr} ／ ${stats.dep}`], ['🛬 Bに 着陸', stats.landB + ' 機'],
    ['🚨 きんきゅう機', `${stats.emgSaved} / ${stats.emg} 機 たすけた`], ['🔁 やりなおし ／ 😡', `${stats.goAround} ／ ${stats.angry} 回`]]
    .map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
}
function saveBest() {
  let best = bestScore();
  if (score > best) { best = score; try { localStorage.setItem('skyTowerBest', String(score)); } catch (e) { /* noop */ } }
  return best;
}
function dayClear() {
  setSpeed(0);
  const g = [[true, '夕方6時まで まもった'], [hearts >= 3, '❤️を 3つ以上 のこした'], [score >= DAY_TARGET, `${DAY_TARGET}びん 以上 はこんだ（${score}びん）`]];
  dayStars = g.filter(x => x[0]).length;
  if (dayStars > bestStars()) { try { localStorage.setItem('skyTowerStars', String(dayStars)); } catch (e) { /* noop */ } }
  const best = saveBest();
  document.getElementById('clStars').textContent = starStr(dayStars);
  document.getElementById('clGoals').innerHTML = g.map(([ok, s]) => (ok ? '✅ ' : '⬜ ') + s).join('<br>');
  document.getElementById('clStats').innerHTML = statItems(best);
  document.getElementById('mClear').classList.add('show');
  tone(523, 0.14, 'triangle'); tone(659, 0.14, 'triangle'); tone(784, 0.2, 'triangle');
}
function goNight() {
  document.getElementById('mClear').classList.remove('show');
  night = true; setSpeed(1);
  radio('🌙 よるの部 スタート！ ひこうきが どんどん ふえるよ。どこまで いけるかな？', false, 4);
}
function finish(title) {
  const best = saveBest();
  document.getElementById('ovTitle').textContent = title;
  document.getElementById('ovReason').textContent = overReason;
  document.getElementById('ovScore').textContent = `${score} びん`;
  document.getElementById('ovStars').textContent = dayDone ? `きょうの ひょうか ${starStr(dayStars)}` : '';
  document.getElementById('ovStats').innerHTML = statItems(best);
  document.getElementById('rbText').textContent = `${score}びん　${overReason}`;
  setTimeout(() => showOver(), 900);
  updateUI();
}
function showOver() { document.getElementById('resultBar').classList.remove('show'); document.getElementById('mOver').classList.add('show'); }
function viewBoard() { document.getElementById('mOver').classList.remove('show'); document.getElementById('resultBar').classList.add('show'); }
function openHelp() { if (!over) { setSpeed(0); document.getElementById('mStart').classList.add('show'); } }

function newGame() {
  planes = []; nextId = 1; selected = null; t = 0; score = 0; hearts = HEARTS; spawnT = 3;
  over = false; crashAt = null; overReason = ''; dayDone = false; night = false; dayStars = 0; D = 1; bOpen = false;
  storm = { phase: 'none', t: 0, next: 15 }; wind = { phase: 'none', t: 0, next: 25 };
  seenTypes = new Set(['jet']); seenEmg = false;
  stats = { arr: 0, dep: 0, goAround: 0, angry: 0, emg: 0, emgSaved: 0, emgLost: 0, storms: 0, winds: 0, landB: 0 };
  for (const g of GATES) g.plane = null;
  [[0, 2], [2, 6]].forEach(([gi, tm]) => {
    const g = GATES[gi], p = makePlane('unload', g.x, GATE_Y); p.timer = tm; p.gate = g; g.plane = p; p.ang = -Math.PI / 2;
  });
  ['mOver', 'mClear'].forEach(id => document.getElementById(id).classList.remove('show'));
  document.getElementById('resultBar').classList.remove('show');
  started = true; setSpeed(1); renderCmds(); updateUI();
}
function startGame() {
  document.getElementById('mStart').classList.remove('show');
  if (!started || over) newGame(); else setSpeed(1);
  tone(660, 0.1, 'triangle');
}

let last = performance.now(), cmdTick = 0;
function loop(ts) {
  const dt = Math.min(0.1, Math.max(0, (ts - last) / 1000)); last = ts;
  update(dt);
  cmdTick += dt; if (cmdTick > 0.25) { cmdTick = 0; if (!over && started) renderCmds(); updateUI(); }
  draw(ts / 1000);
  requestAnimationFrame(loop);
}
document.getElementById('uiVer').textContent = 'バージョン ' + APP_VERSION;
{ const b = bestScore(), s = bestStars(); document.getElementById('uiBest').textContent = b ? `いちばんの 記録：${b} びん　${starStr(s)}` : ''; }
storm = { phase: 'none', t: 0, next: 15 }; wind = { phase: 'none', t: 0, next: 25 };
stats = { arr: 0, dep: 0, goAround: 0, angry: 0, emg: 0, emgSaved: 0, emgLost: 0, storms: 0, winds: 0, landB: 0 };
resize(); updateUI();
requestAnimationFrame(loop);
</script>
